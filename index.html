/* Layout: uma barra de marca fina no topo, palco preto da marca na abertura, conteúdo em coluna larga de tablet com barra de ação fixa embaixo. A linha horizontal da logo vira o marcador de seção. */
:root {
  --bg: #FAF8F9; --surface: #FFFFFF; --surface-2: #F4F0F3; --figbg: #F3EEF1;
  --ink: #151215; --ink-2: #4A444A; --muted: #6F676E; --line: #E6DFE4; --line-2: #D4CBD1;
  --pink: #FF0084; --pink-ink: #C2006A; --pink-soft: #FFE8F3; --on-pink: #FFFFFF;
  --stage: #0B0A0B; --on-stage: #FFFFFF; --stage-muted: #BDB4BA; --stage-line: #2C272B;
  --ok: #18804F; --ok-soft: #E2F3EA; --warn: #9A5B00; --warn-soft: #FFF2DC; --bad: #B4232F; --bad-soft: #FCE7E8;
  --shadow: 0 1px 2px rgba(21, 18, 21, .06), 0 8px 24px rgba(21, 18, 21, .06);
  --f-display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --f-body: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F0E0F; --surface: #181618; --surface-2: #211E21; --figbg: #EDE7EB;
  --ink: #F6F2F5; --ink-2: #D5CDD3; --muted: #A1989F; --line: #312C30; --line-2: #463F45;
  --pink: #FF2B95; --pink-ink: #FF66B4; --pink-soft: #3A1029; --on-pink: #FFFFFF;
  --ok: #4CC38A; --ok-soft: #10301F; --warn: #F0A63A; --warn-soft: #3A2A10; --bad: #FF7A83; --bad-soft: #3A1418;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F0E0F; --surface: #181618; --surface-2: #211E21; --figbg: #EDE7EB;
  --ink: #F6F2F5; --ink-2: #D5CDD3; --muted: #A1989F; --line: #312C30; --line-2: #463F45;
  --pink: #FF2B95; --pink-ink: #FF66B4; --pink-soft: #3A1029; --on-pink: #FFFFFF;
  --ok: #4CC38A; --ok-soft: #10301F; --warn: #F0A63A; --warn-soft: #3A2A10; --bad: #FF7A83; --bad-soft: #3A1418;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* logo por tema */
.logo-d { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-l { display: none; } :root:not([data-theme="light"]) .logo-d { display: block; } }
:root[data-theme="dark"] .logo-l { display: none; } :root[data-theme="dark"] .logo-d { display: block; }

/* barra */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 16px; min-height: 64px; flex-wrap: wrap; padding-block: 8px; }
.bar .brand { display: flex; align-items: center; background: none; border: 0; padding: 0; }
.bar .brand img { height: 34px; width: auto; }
.bar nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.navb { border: 0; background: none; padding: 10px 14px; border-radius: 999px; font-weight: 500; color: var(--ink-2); font-size: 15px; }
.navb:hover { background: var(--surface-2); }
.navb[aria-current="page"] { background: var(--ink); color: var(--bg); }
.dbpill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.dbpill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dbpill.ok i { background: var(--ok); } .dbpill.off i { background: var(--bad); }

main { padding-block: 28px 140px; }

/* tipografia */
.eyebrow { display: flex; align-items: center; gap: 12px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--pink-ink); font-weight: 600; }
.eyebrow::before { content: ""; width: 36px; height: 1px; background: currentColor; }
.h1 { font: 400 clamp(32px, 5vw, 52px)/1.08 var(--f-display); letter-spacing: -.01em; }
.h2 { font: 400 clamp(26px, 3.4vw, 36px)/1.15 var(--f-display); }
.h3 { font: 600 19px/1.3 var(--f-body); }
.lead { font-size: 19px; color: var(--ink-2); max-width: 62ch; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 32px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 24px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 16px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--ink-2); }
.btn.pri { background: var(--pink); border-color: var(--pink); color: var(--on-pink); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { min-height: 40px; padding: 0 16px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.linkb { border: 0; background: none; padding: 0; color: var(--pink-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* palco de abertura */
.stage { background: var(--stage); color: var(--on-stage); border-radius: 24px; overflow: hidden; position: relative; }
.stage-in { padding: clamp(32px, 6vw, 72px) clamp(20px, 6vw, 72px); display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.stage .logo-big { width: min(420px, 100%); height: auto; display: block; }
.stage h1 { font: 400 clamp(34px, 5.2vw, 58px)/1.05 var(--f-display); margin-top: 28px; }
.stage h1 em { color: var(--pink); font-style: italic; }
.stage p { color: var(--stage-muted); font-size: 19px; margin-top: 18px; max-width: 46ch; }
.stage .meta { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 22px; color: var(--stage-muted); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.stage .btn.ghost { color: var(--on-stage); border-color: var(--stage-line); }
.stage-figs { display: flex; justify-content: center; align-items: flex-end; gap: 0; height: 380px; }
.stage-figs .f { width: 33%; height: 100%; display: flex; align-items: flex-end; background: #F3EEF1; border-radius: 160px 160px 12px 12px; margin: 0 -2px; overflow: hidden; border: 3px solid var(--stage); }
.stage-figs .f:nth-child(2) { height: 108%; transform: translateY(-4%); }
.stage-figs svg { width: 100%; height: 92%; display: block; }
.stage-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }

.home-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.tile:hover { border-color: var(--line-2); }
.tile b { font-size: 17px; }

/* formulários */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(18px, 3vw, 28px); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .lbl { font-weight: 600; font-size: 15px; }
.field .hint { font-size: 14px; color: var(--muted); }
.inp { min-height: 52px; border: 1.5px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); padding: 0 14px; font-size: 17px; width: 100%; }
textarea.inp { padding: 12px 14px; min-height: 110px; resize: vertical; line-height: 1.5; }
select.inp { padding-right: 8px; }
.inp:focus { border-color: var(--pink); outline: none; box-shadow: 0 0 0 3px var(--pink-soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--pink); color: var(--on-pink); font-size: 12px; font-weight: 700; }
.chip.sw::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--sw); border: 1px solid var(--line-2); }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; }
.check input { width: 24px; height: 24px; accent-color: var(--pink); flex: none; margin-top: 1px; }

/* teste */
.qhead { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
.prog { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog .track { flex: 1; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.prog .track b { display: block; height: 100%; background: var(--pink); border-radius: 4px; transition: width .3s ease; }
.qtitle { font: 400 clamp(26px, 3.6vw, 38px)/1.15 var(--f-display); max-width: 30ch; }
.qsub { color: var(--muted); font-size: 16px; }

.opts { display: grid; gap: 14px; }
.opts.looks { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.opts.pal { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.opts.det { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.opts.txt { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.opt { position: relative; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 0; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, transform .15s; }
.opt:hover { border-color: var(--line-2); }
.opt:active { transform: scale(.99); }
.opt[aria-pressed="true"] { border-color: var(--pink); box-shadow: 0 0 0 3px var(--pink-soft); }
.opt .pic { background: var(--figbg); display: flex; align-items: flex-end; justify-content: center; }
.opt .pic svg { display: block; width: 100%; height: auto; }
.opts.looks .pic { aspect-ratio: 160 / 300; } .opts.looks .pic svg { height: 100%; }
.opts.det .pic { aspect-ratio: 130 / 170; } .opts.det .pic svg { height: 100%; }
.opt .cap { padding: 12px 14px 14px; font-size: 15px; line-height: 1.35; font-weight: 500; }
.opts.txt .opt { min-height: 76px; justify-content: center; }
.opts.txt .opt .cap { padding: 16px 52px 16px 18px; font-size: 17px; }
.opt .tick { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--pink); color: var(--on-pink); display: none; place-items: center; font-weight: 700; font-size: 15px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.opt[aria-pressed="true"] .tick { display: grid; }
.opts.txt .opt .tick { top: 50%; transform: translateY(-50%); right: 14px; }
.specials { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.group + .group { margin-top: 26px; }
.group .lbl { margin-bottom: 12px; display: block; }

.actbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.actbar .wrap { display: flex; gap: 10px; align-items: center; padding-block: 12px; flex-wrap: wrap; }
.actbar .sp { flex: 1; }

/* revisão */
.rev { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.rev button { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 14px 18px; }
.rev button:last-child { border-bottom: 0; }
.rev button:hover { background: var(--surface-2); }
.rev .num { font: 400 22px var(--f-display); color: var(--pink-ink); font-variant-numeric: tabular-nums; }
.rev .q { font-weight: 600; font-size: 15px; }
.rev .a { font-size: 15px; color: var(--ink-2); }
.rev .a.empty { color: var(--muted); font-style: italic; }

/* desempate */
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; max-width: 760px; }
.duo .opt .pic { aspect-ratio: 160 / 300; } .duo .opt .pic svg { height: 100%; }
.duo .opt.frase { min-height: 180px; justify-content: center; }
.duo .opt.frase .cap { font: 400 italic 24px/1.3 var(--f-display); padding: 28px; }

/* resultado */
.res-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.res-hero .h1 em { font-style: italic; color: var(--pink-ink); }
.trio { display: flex; align-items: flex-end; height: 230px; }
.trio .f { width: 100px; height: 100%; background: var(--figbg); border-radius: 80px 80px 10px 10px; overflow: hidden; display: flex; align-items: flex-end; border: 3px solid var(--bg); margin-left: -10px; }
.trio .f:first-child { margin-left: 0; height: 112%; width: 116px; }
.trio .f svg { width: 100%; height: 94%; }
.banner { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner b { color: var(--warn); }
.banner.info { background: var(--surface-2); border-color: var(--line); }
.banner.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.banner.ok b { color: var(--ok); }

.style-card { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.style-card .pic { background: var(--figbg); display: flex; align-items: flex-end; justify-content: center; padding-top: 16px; }
.style-card .pic svg { width: 100%; max-width: 200px; height: auto; display: block; }
.style-card .body { padding: clamp(20px, 3vw, 32px); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.rank { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.style-card.principal .rank { color: var(--pink-ink); }
.sname { font: 400 clamp(30px, 4vw, 42px)/1.05 var(--f-display); }
.sname small { font: 400 italic 20px var(--f-display); color: var(--muted); margin-left: 8px; }
.kw { display: flex; gap: 6px; flex-wrap: wrap; }
.kw span { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--pink-soft); color: var(--pink-ink); font-weight: 600; }
.dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
.dl div { min-width: 0; }
.dl dt { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.dl dd { margin: 0; font-size: 15px; }
.because { background: var(--surface-2); border-radius: var(--r-sm); padding: 14px 16px; }
.because ul, .plain { margin: 6px 0 0; padding-left: 18px; }
.because li, .plain li { margin: 3px 0; }

.interp { background: var(--stage); color: var(--on-stage); border-radius: 20px; padding: clamp(24px, 4vw, 44px); display: flex; flex-direction: column; gap: 16px; }
.interp .eyebrow { color: var(--pink); }
.interp p.big { font: 400 clamp(21px, 2.6vw, 27px)/1.45 var(--f-display); max-width: 60ch; }
.interp p { color: var(--stage-muted); max-width: 66ch; }

.looks-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.lookc { border: 1px solid var(--line); border-radius: var(--r); padding: 18px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.lookc .oc { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--pink-ink); font-weight: 700; }

.how { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.how > div { padding: 16px 20px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; }
.how > div:last-child { border-bottom: 0; }
.how .nm { font: 400 22px/1.2 var(--f-display); }
.how .nm span { display: block; font: 500 13px var(--f-body); color: var(--muted); margin-top: 4px; }
.dots { display: flex; gap: 4px; margin-top: 8px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--pink); }

.valid { display: flex; gap: 10px; flex-wrap: wrap; }
.closing { text-align: center; padding: 28px 16px 8px; }
.closing p { font: 400 italic clamp(20px, 2.4vw, 26px)/1.4 var(--f-display); max-width: 40ch; margin: 0 auto; }

/* consultora */
.staff-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; padding: 22px 24px; border-radius: 20px; background: var(--stage); color: var(--on-stage); }
.staff-head .eyebrow { color: var(--pink); }
.staff-head .h2 { color: var(--on-stage); }
.staff-head p { color: var(--stage-muted); }
.sec { display: flex; flex-direction: column; gap: 14px; }
.sec > h3 { display: flex; align-items: center; gap: 12px; font: 400 26px/1.2 var(--f-display); }
.sec > h3::before { content: ""; width: 28px; height: 1px; background: var(--pink); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.box h4 { margin: 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.tag.p { background: var(--pink); color: var(--on-pink); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.sugg { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.sugg > div { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sugg > div:last-child { border-bottom: 0; }
.sugg .t { flex: 1; min-width: 160px; }
.yn { display: flex; gap: 6px; }
.yn button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--surface); font-size: 14px; font-weight: 600; }
.yn button.y[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.yn button.n[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }

/* clientes */
.filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.filters .field > label { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.filters .inp { min-height: 46px; font-size: 15px; }
.clist { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.cc { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.cc:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.cc .nm { font: 400 24px/1.15 var(--f-display); }
.cc .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.cc .sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { border: 1.5px dashed var(--line-2); border-radius: 20px; padding: 40px 24px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty .h2 { font-size: 28px; }
.hist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.hist > div { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.hist > div:last-child { border-bottom: 0; }
.hist .d { font-variant-numeric: tabular-nums; font-weight: 600; }

/* método */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 640px; }
.tbl th, .tbl td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.prose { max-width: 70ch; display: flex; flex-direction: column; gap: 12px; color: var(--ink-2); }
.prose b { color: var(--ink); }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-weight: 600; z-index: 40; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.copybox { width: 100%; min-height: 160px; font-size: 14px; }

@media (max-width: 860px) {
  .stage-in { grid-template-columns: 1fr; }
  .stage-figs { height: 260px; order: -1; }
  .home-grid { grid-template-columns: 1fr; }
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .looks-grid { grid-template-columns: 1fr; }
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  body { font-size: 16px; }
  .style-card { grid-template-columns: 1fr; }
  .style-card .pic { max-height: 300px; }
  .style-card .pic svg { max-width: 150px; }
  .res-hero { grid-template-columns: 1fr; }
  .trio { height: 180px; }
  .grid2, .grid3, .dl { grid-template-columns: 1fr; }
  .opts.looks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opts.det { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opts.pal { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opts.txt { grid-template-columns: 1fr; }
  .duo { gap: 10px; }
  .duo .opt.frase .cap { font-size: 19px; padding: 18px; }
  .how > div { grid-template-columns: 1fr; gap: 6px; }
  .bar .brand img { height: 28px; }
  .navb { padding: 8px 10px; font-size: 14px; }
  .actbar .btn { padding: 0 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
/* ===== Euphoria — banco local no aparelho (IndexedDB) =====
   Mesma interface usada pelo app: db.collection(nome).onSnapshot / where().get,
   db.doc('colecao/id').set / update / delete. Tudo fica neste navegador. */
(function (root) {
  const NOME = 'euphoria-estilo', LOJA = 'docs';
  let idb = null; const cache = new Map(); const ouvintes = new Map();

  function abrir() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(NOME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(LOJA);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  function tx(modo, fn) {
    return new Promise((res, rej) => {
      const t = idb.transaction(LOJA, modo), s = t.objectStore(LOJA);
      const out = fn(s);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abortado'));
    });
  }
  const colDe = path => path.split('/')[0];
  function snapshot(col) {
    const docs = [];
    for (const [k, v] of cache) if (colDe(k) === col) docs.push({ id: k.slice(col.length + 1), exists: true, data: () => JSON.parse(JSON.stringify(v)) });
    return { docs, size: docs.length, empty: !docs.length };
  }
  function avisar(col) { (ouvintes.get(col) || []).forEach(fn => { try { fn(snapshot(col)); } catch (e) { console.error(e); } }); }
  function erro(e) { const err = new Error((e && e.message) || 'Falha ao gravar neste aparelho'); err.code = (e && e.name === 'QuotaExceededError') ? 'quota_exceeded' : 'unavailable'; return err; }

  async function gravar(path, valor) {
    try {
      await tx('readwrite', s => valor === null ? s.delete(path) : s.put(valor, path));
      if (valor === null) cache.delete(path); else cache.set(path, valor);
      avisar(colDe(path));
    } catch (e) { throw erro(e); }
  }
  function merge(a, b) {
    const o = Object.assign({}, a);
    for (const [k, v] of Object.entries(b)) o[k] = (v && typeof v === 'object' && !Array.isArray(v) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) ? merge(o[k], v) : v;
    return o;
  }

  const db = {
    doc(path) {
      return {
        id: path.split('/').pop(), path,
        async get() { const v = cache.get(path); return { id: path.split('/').pop(), exists: !!v, data: () => v && JSON.parse(JSON.stringify(v)) }; },
        set: data => gravar(path, JSON.parse(JSON.stringify(data))),
        async update(data) { const cur = cache.get(path); if (!cur) { const e = new Error('Documento não encontrado'); e.code = 'invalid_argument'; throw e; } return gravar(path, merge(cur, JSON.parse(JSON.stringify(data)))); },
        delete: () => gravar(path, null)
      };
    },
    collection(col) {
      const filtros = [];
      const q = {
        where(campo, op, valor) { filtros.push([campo, op, valor]); return q; },
        async get() {
          const snap = snapshot(col);
          const docs = snap.docs.filter(d => filtros.every(([c, op, v]) => { const x = d.data()[c]; return op === '==' ? x === v : op === '!=' ? x !== v : true; }));
          return { docs, size: docs.length, empty: !docs.length };
        },
        onSnapshot(fn) { if (!ouvintes.has(col)) ouvintes.set(col, []); ouvintes.get(col).push(fn); setTimeout(() => fn(snapshot(col)), 0); return () => { const a = ouvintes.get(col); a.splice(a.indexOf(fn), 1); }; },
        doc: id => db.doc(col + '/' + id)
      };
      return q;
    }
  };

  /* backup */
  function exportar() {
    const docs = {}; for (const [k, v] of cache) if (!k.startsWith('_')) docs[k] = v;
    return { app: 'Euphoria Estilo', versao: 1, criadoEm: new Date().toISOString(), docs };
  }
  async function importar(obj, modo) {
    if (!obj || obj.app !== 'Euphoria Estilo' || !obj.docs) { const e = new Error('Este arquivo não é um backup do Euphoria Estilo.'); e.code = 'invalid_argument'; throw e; }
    try {
      await tx('readwrite', s => {
        if (modo === 'substituir') for (const k of cache.keys()) if (!k.startsWith('_')) s.delete(k);
        for (const [k, v] of Object.entries(obj.docs)) s.put(v, k);
      });
    } catch (e) { throw erro(e); }
    if (modo === 'substituir') for (const k of [...cache.keys()]) if (!k.startsWith('_')) cache.delete(k);
    for (const [k, v] of Object.entries(obj.docs)) cache.set(k, v);
    ['clientes', 'atendimentos'].forEach(avisar);
    return Object.keys(obj.docs).length;
  }
  const meta = {
    get: k => cache.get('_meta/' + k),
    set: (k, v) => gravar('_meta/' + k, v)
  };

  async function iniciar() {
    idb = await abrir();
    await new Promise((res, rej) => {
      const t = idb.transaction(LOJA, 'readonly'), s = t.objectStore(LOJA), r = s.openCursor();
      r.onsuccess = () => { const c = r.result; if (c) { cache.set(c.key, c.value); c.continue(); } else res(); };
      r.onerror = () => rej(r.error);
    });
    let persistente = false;
    try { if (navigator.storage && navigator.storage.persist) persistente = await navigator.storage.persist(); } catch (e) { }
    return { db, persistente };
  }

  root.LocalDB = { iniciar, exportar, importar, meta };
})(this);

</script>

  /* ---------- utilidades ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- estado ---------- */

  }

  /* ---------- cálculo ---------- */
  function calc(ses) {

  }

  /* ---------- banco ---------- */

        S.clientes = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));

      tamCima: f.tamCima || '', tamBaixo: f.tamBaixo || '', cores: f.cores || [], coresOutras: f.coresOutras || '',
      tipoCorpo: f.tipoCorpo || '', faixa: f.faixa || '', atualizadoEm: hoje()
    };
  }
  function atendimentoPayload(ses, c) {
    return clean({
      clienteId: ses.clienteId, tipo: 'teste', data: ses.inicio, dados: ses.dados, respostas: ses.respostas, desempates: ses.desempates,
      estilos: c.estilos, estilosCalculados: c.r.estilos, ajustado: c.ajustado, preliminar: c.r.preliminar, consistencia: c.r.consistencia,
      pontos: c.p.atual, desejo: c.p.desejo, desejoPrincipal: c.r.desejoPrincipal, validacao: ses.validacao,
      observacoes: ses.observacoes, sugestoes: ses.sugestoes, extras: ses.extras, tipoCorpo: ses.tipoCorpo, salvoEm: hoje()
    });

  async function salvarAtendimento() {
    const ses = S.sessao; if (!S.db || !ses.clienteId) return false;
    const c = calc(); S.salvando = true; render();
    try {
      if (!ses.atendimentoId) ses.atendimentoId = uid('a_');
      await S.db.doc('atendimentos/' + ses.atendimentoId).set(atendimentoPayload(ses, c));
      const cli = S.clientes.find(x => x.id === ses.clienteId) || {};
      const upd = { ultimaVisita: ses.inicio > (cli.ultimaVisita || '') ? ses.inicio : (cli.ultimaVisita || ses.inicio), atualizadoEm: hoje() };
      if (!cli.ultimoTeste || ses.inicio >= cli.ultimoTeste) Object.assign(upd, { estilos: c.estilos, estiloPrincipal: c.estilos[0] || '', ultimoTeste: ses.inicio, ultimoAtendimento: ses.atendimentoId });
      if (ses.tipoCorpo) upd.tipoCorpo = ses.tipoCorpo;
      await S.db.doc('clientes/' + ses.clienteId).update(upd);
      ses.dirty = false; limparRascunho(); toast('Atendimento salvo na ficha.');
      return true;
    } catch (e) { toast(msgErro(e)); return false; }

  function msgErro(e) {

    if (c === 'unavailable') return 'Sem conexão com o banco agora. Confira a internet e tente de novo.';

  /* Pergunta */
  function picOpcao(q, k) {
    if (q.tipo === 'look') return `<div class="pic">${figura(LOOKS[q.set][k], q.opcoes[k])}</div>`;

  function telaPergunta() {

  function temResposta(q) { const v = S.sessao.respostas[q.id]; if (!v) return false; if (Array.isArray(v)) return v.length > 0; return Object.keys(v).length > 0; }

    const total = Math.min(Score.LIMITES.maxDesempates, idx + c.r.pendentes.length);
    const card = (k, lado) => {
      if (fmt.tipo === 'look') return `<button class="opt" data-a="desemp" data-v="${lado}">${`<div class="pic">${figura(LOOKS.evento[k])}</div>`}<span class="cap">${esc(E[k].looks.evento.charAt(0).toUpperCase() + E[k].looks.evento.slice(1))}</span></button>`;
      if (fmt.tipo === 'paleta') return `<button class="opt" data-a="desemp" data-v="${lado}"><div class="pic">${Fig.paleta(k)}</div><span class="cap">${esc(cap(E[k].diaADia[0]))}</span></button>`;

      <div class="specials"><button class="chip" data-a="desemp" data-v="ambas">Gosto das duas</button><button class="chip" data-a="desemp" data-v="nenhuma">Nenhuma das duas</button></div>
      <div class="actbar"><div class="wrap"><button class="btn" data-a="go" data-v="revisar">Revisar respostas</button><span class="sp"></span><button class="btn ghost" data-a="pularRefino">Ver resultado agora</button></div></div>`;

  /* Resultado da cliente */
  function porque(c, k) {
    const seen = new Set(); return c.p.contrib[k].filter(x => x.pts > 0 && !seen.has(x.resposta) && seen.add(x.resposta)).map(x => x.resposta).slice(0, 4);
  }
  function telaResultado() {

      return `<div class="stack-lg" style="max-width:760px"><div class="stack"><span class="eyebrow">Resultado de ${esc(nome)}</span><h1 class="h1">Ainda não conseguimos identificar seu estilo</h1>

            <div><dt>Acessórios</dt><dd>${cap(lista(e.acessorios))}</dd></div>
            <div><dt>Calçados</dt><dd>${cap(lista(e.calcados))}</dd></div>

          <p><b>O que acrescenta à sua imagem:</b> ${e.acrescenta}</p>

        </div></article>`;
    }).join('');
    const ordemHow = c.r.ranking.filter(k => c.p.atual[k] > 0 || c.p.desejo[k] > 0);
    const nGosto = PERGUNTAS.filter(q => q.bloco === 'gosto').length;
    const evitadosTxt = c.p.evitados.map(k => PERGUNTAS.find(q => q.id === 'q7').opcoes[k].toLowerCase());
    return `<div class="stack-lg">
      <section class="res-hero"><div class="stack"><span class="eyebrow">Resultado de ${esc(nome)}</span>
        <h1 class="h1">Seu estilo principal é <em>${E[P].nome}</em></h1>
        ${Sg ? `<p class="lead">Complementado pelo ${E[Sg].nome}${T ? ` e pelo ${E[T].nome}` : ''}.</p>` : '<p class="lead">Suas escolhas mostram um estilo bem definido.</p>'}
        ${c.ajustado ? '<span class="tag p" style="align-self:flex-start">Ajustado pela consultora</span>' : ''}</div>
        <div class="trio" aria-hidden="true">${est.map(k => `<div class="f">${figura(LOOKS.dia[k])}</div>`).join('')}</div></section>
      ${c.r.preliminar && !c.ajustado ? `<div class="banner"><span><b>Resultado preliminar.</b> Suas respostas ainda não mostram um padrão forte. ${pend ? 'Responda mais algumas perguntas rápidas para confirmar.' : 'Converse com a consultora para confirmar.'}</span>${pend ? '<button class="btn sm" data-a="go" data-v="refino">Responder</button>' : ''}</div>` : ''}
      ${!c.r.preliminar && !c.ajustado && Sg && !T && est.length === 2 ? '' : ''}
      ${cards}
      <section class="interp"><span class="eyebrow">A sua combinação</span>
        <p class="big">${Score.interpretacao(est)}</p>
        ${Score.leituraPar(est) ? `<p>${Score.leituraPar(est)}</p>` : ''}
        ${Score.diferencas(est).map(t => `<p>${t}</p>`).join('')}
        ${est.length < 3 ? `<p>${est.length === 1 ? 'Seu resultado mostrou um estilo predominante. Os outros apareceram pouco, então não indicamos secundário e terciário.' : 'Um terceiro estilo apareceu pouco nas respostas, então mostramos só os dois que se destacaram.'}</p>` : ''}
      </section>
      ${des ? `<section class="sec"><h3>A imagem que você quer transmitir</h3><div class="box"><p>${des.texto}</p>${des.dicas ? `<ul class="plain">${des.dicas.map(d => `<li>${cap(d)}</li>`).join('')}</ul>` : ''}</div></section>` : ''}
      <section class="sec"><h3>Ideias de looks para a sua rotina</h3><div class="looks-grid">${looks.map(l => `<div class="lookc"><span class="oc">${l.ocasiao}</span><p>${esc(l.texto)}</p></div>`).join('')}</div></section>
      <section class="sec"><h3>Como esse resultado apareceu</h3>
        <p class="muted">Cada resposta sobre o seu gosto atual somou pontos para os estilos que ela representa. Quando você marcou duas opções, os pontos foram divididos entre elas. "Depende" e "nenhuma dessas" não somaram pontos. A imagem que você quer transmitir foi analisada à parte.</p>
        <div class="how">${ordemHow.map(k => { const g = c.p.evid[k], pq = porque(c, k); return `<div><div class="nm">${E[k].nome}<span>${est.includes(k) ? RANK_ROT[est.indexOf(k)] : c.p.atual[k] > 0 ? 'apareceu pouco' : 'só na imagem desejada'}</span></div><div class="small">
          ${c.p.atual[k] > 0 ? `Apareceu em ${g} de ${nGosto} perguntas sobre o seu gosto${ses.desempates.length ? ' e desempates' : ''}.<div class="dots" aria-hidden="true">${Array.from({ length: nGosto }, (_, i) => `<i class="${i < Math.min(g, nGosto) ? 'on' : ''}"></i>`).join('')}</div>` : ''}
          ${pq.length ? `<div style="margin-top:8px">${pq.map(esc).join(' · ')}</div>` : ''}
          ${c.p.contribDesejo[k].length ? `<div class="muted" style="margin-top:6px">Na imagem desejada: ${c.p.contribDesejo[k].map(x => esc(x.resposta)).join(' · ')}</div>` : ''}
          ${c.p.evitados.includes(k) ? `<div class="muted" style="margin-top:6px">Você contou que evita: ${esc(PERGUNTAS.find(q => q.id === 'q7').opcoes[k].toLowerCase())}.</div>` : ''}
        </div></div>`; }).join('')}</div>
        ${evitadosTxt.length ? '' : ''}

      <section class="card stack"><h3 class="h3">Esse resultado faz sentido para você?</h3>

  }
  function salvarBtn() {
    const ses = S.sessao;
    if (S.dbStatus !== 'ok') return '';
    if (ses.consent === 'nao' && !ses.clienteId) return '<span class="muted small">Sem cadastro</span>';
    if (ses.atendimentoId && !ses.dirty) return '<span class="tag ok">Salvo na ficha</span>';
    if (ses.clienteId) return `<button class="btn pri" data-a="salvar" ${S.salvando ? 'disabled' : ''}>${ses.atendimentoId ? 'Salvar alterações' : 'Salvar na ficha'}</button>`;
    return '<button class="btn pri" data-a="consent">Salvar na ficha</button>';

  /* WhatsApp */
  function textoWhats() {
    const ses = S.sessao, c = calc(), est = c.estilos, nome = ses.dados.nome;
    if (!est.length) return '';
    const L = [];
    L.push(`Olá${nome ? ', ' + nome : ''}! Aqui está o resultado do seu teste de estilo na *Euphoria Moda Feminina*.`);
    L.push('');
    est.forEach((k, i) => L.push(`*${RANK_ROT[i]}:* ${E[k].titulo} (${E[k].palavras.join(', ')})`));
    L.push(''); L.push(Score.interpretacao(est));
    const lp = Score.leituraPar(est); if (lp) L.push(lp);
    L.push(''); L.push('*Peças que combinam com você:* ' + lista(Score.direcionamento(est).categorias) + '.');
    L.push('*Cores:* ' + lista(Score.direcionamento(est).cores) + '.');
    L.push(''); Score.looksSugeridos(est, ses.dados.finalidades).forEach(l => L.push(`• ${l.ocasiao}: ${l.texto}`));
    L.push(''); L.push('Lembre: seu estilo é flexível e pode misturar referências. Estamos te esperando na loja!');
    return L.join('\n');
  }
  function waBox() {
    const ses = S.sessao, cli = ses.clienteId ? S.clientes.find(c => c.id === ses.clienteId) : null;
    const num = waNum(cli && cli.whatsapp);

  async function criarCliente(f, comTeste) {

    try {
      await S.db.doc('clientes/' + id).set(clean(Object.assign(fichaPayload(f), { criadoEm: hoje(), consentimento: { aceito: true, data: hoje(), texto: 'v1' }, ultimaVisita: comTeste ? S.sessao.inicio : hoje(), estilos: [], estiloPrincipal: '' })));
      S.clientes = S.clientes.concat([Object.assign({ id }, fichaPayload(f))]);
      return id;
    } catch (e) { toast(msgErro(e)); return null; }

  /* Atendimento (consultora) */

    const especiais = c.p.especiais.filter(x => x.tipo === 'depende' || x.tipo === 'nenhuma').map(x => `${PERGUNTAS.find(q => q.id === x.q).resumoCurto}: ${ESPECIAIS[x.tipo].rotulo.toLowerCase()}`);

            <div class="row small">${c.ajustado ? '<span class="tag p">Ajustado pela consultora</span>' : ''}${c.r.preliminar ? '<span class="tag warn">Preliminar</span>' : ''}<span class="tag ${c.r.consistencia === 'alta' ? 'ok' : c.r.consistencia === 'baixa' ? 'warn' : ''}">Consistência ${c.r.consistencia}</span>${ses.validacao ? `<span class="tag ${ses.validacao === 'sim' ? 'ok' : 'warn'}">Cliente: ${{ sim: 'faz sentido', parte: 'em parte', nao: 'não muito' }[ses.validacao]}</span>` : ''}</div>

          <div class="box"><h4>Respeitar no atendimento</h4><ul class="plain small">${q7.length ? q7.map(x => `<li>Evita: ${esc(x.toLowerCase())}</li>`).join('') : '<li>Não indicou nada que evita</li>'}${especiais.map(x => `<li>${esc(x)}</li>`).join('')}${notas.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
        </div>
        <details class="box"><summary class="lbl" style="cursor:pointer">Corrigir o resultado</summary>

          <div class="grid3">${[0, 1, 2].map(i => `<div class="field"><label for="aj${i}">${RANK_ROT[i]}</label><select id="aj${i}" class="inp" data-a2="ajuste" data-i="${i}">${optE(aj[i] || '')}</select></div>`).join('')}</div>
          ${c.ajustado ? '<button class="btn sm" data-a="limparAjuste" style="align-self:flex-start">Voltar ao resultado calculado</button>' : ''}</details>
      </section>

      <section class="sec"><h3>Tipo de corpo</h3>
        <div class="chips">${Object.entries(TIPOS_CORPO).map(([k, t]) => `<button class="chip" data-a="corpo" data-v="${k}" aria-pressed="${corpo === k}">${t.nome}</button>`).join('')}</div>
        ${corpo ? `<div class="box"><h4>${TIPOS_CORPO[corpo].nome} · ${TIPOS_CORPO[corpo].desc}</h4><p class="small">Modelagens que costumam valorizar. Combine com o estilo dela e com o que ela gosta de mostrar:</p><ul class="plain small">${TIPOS_CORPO[corpo].dicas.map(d => `<li>${cap(d)}</li>`).join('')}</ul>${est[0] ? `<p class="small muted">Dentro do ${E[est[0]].nome}: escolha ${E[est[0]].priorizar.slice(0, 2).join(' e ')} com essas modelagens.</p>` : ''}</div>` : '<p class="small muted">O tipo de corpo não muda o estilo. Serve só para orientar as modelagens.</p>'}

      ${dir ? `<section class="sec"><h3>Direcionamento de vendas</h3>

          <div class="box"><h4>Cores que podem funcionar</h4><p>${cap(lista(dir.cores))}${cli && (cli.cores || []).length ? `<br><span class="small muted">Favoritas da ficha: ${esc(lista(cli.cores.map(x => x.toLowerCase())))}</span>` : ''}</p></div>
          <div class="box"><h4>Acessórios</h4><p>${cap(lista(dir.acessorios))}</p></div>
          <div class="box"><h4>Como misturar os estilos num só look</h4><p>${esc(dir.mistura)}</p></div>
          <div class="box"><h4>Se ela não gostar da primeira sugestão</h4><ul class="plain small">${dir.alternativas.map(a => `<li>${cap(esc(a))}</li>`).join('')}</ul></div>
        </div>
        <div class="looks-grid">${Score.looksSugeridos(est, ses.dados.finalidades).map(l => `<div class="lookc"><span class="oc">${l.ocasiao}</span><p class="small">${esc(l.texto)}</p></div>`).join('')}</div>
      </section>` : ''}

      <section class="sec"><h3>Sugestões apresentadas</h3>

        <div class="sugg">${sugList.map(t => { const v = ses.sugestoes[t]; return `<div><span class="t">${cap(esc(t))}</span><span class="yn"><button class="y" data-a="sug" data-t="${esc(t)}" data-v="ok" aria-pressed="${v === 'ok'}">Aprovou</button><button class="n" data-a="sug" data-t="${esc(t)}" data-v="nao" aria-pressed="${v === 'nao'}">Recusou</button></span></div>`; }).join('')}
          <div><input class="inp" id="nova-sug" placeholder="Outra peça apresentada (ex.: vestido envelope verde)" style="flex:1;min-width:200px"><button class="btn sm" data-a="addSug">Adicionar</button></div></div>
      </section>

      <section class="sec"><h3>Perguntas para aprofundar</h3><ul class="plain">${PERGUNTAS_CONSULTORA.map(p => `<li>${p}</li>`).join('')}${des && des.tipo === 'desenvolver' ? `<li>Você gostaria de experimentar algo mais ${E[des.estilo].nome.toLowerCase()} hoje?</li>` : ''}</ul></section>

      <section class="sec"><h3>Observações da consultora</h3>
        <textarea id="obs" class="inp" data-f="sessao.observacoes" placeholder="Ex.: prefere comprimento midi, não gosta de amarelo, vem para um casamento em dezembro">${esc(ses.observacoes)}</textarea></section>

        ${ses.clienteId && S.dbStatus === 'ok' ? `<button class="btn pri" data-a="salvar" ${S.salvando ? 'disabled' : ''}>${ses.atendimentoId && !ses.dirty ? 'Salvo ✓' : 'Salvar atendimento'}</button>` : S.dbStatus === 'ok' && ses.consent !== 'nao' ? '<button class="btn pri" data-a="consent">Cadastrar e salvar</button>' : '<span class="muted small">Não será salvo</span>'}
      </div></div>`;
  }

  /* Clientes */
  function filtrar() {
    const f = S.filtros, q = norm(f.q), qd = digitos(f.q);
    return S.clientes.filter(c => {
      if (q && !(c.nomeBusca || '').includes(q) && !(qd.length >= 3 && digitos(c.whatsapp).includes(qd)) && !norm(c.email).includes(q)) return false;
      if (f.estilo && c.estiloPrincipal !== f.estilo) return false;
      if (f.corpo && c.tipoCorpo !== f.corpo) return false;
      if (f.cima && c.tamCima !== f.cima) return false;
      if (f.baixo && c.tamBaixo !== f.baixo) return false;
      if (f.aniver && +c.aniverMes !== +f.mes) return false;
      if (f.visita) { const d = diasDesde(c.ultimaVisita); if (f.visita === 'ate30') { if (d === null || d > 30) return false; } else if (d !== null && d < +f.visita) return false; }
      return true;
    }).sort((a, b) => f.aniver ? (a.aniverDia || 99) - (b.aniverDia || 99) : (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  }
  function telaClientes() {
    const f = S.filtros, lst = filtrar(), mesAtual = new Date().getMonth() + 1;
    const sel = (id, campo, opts, vazio) => `<select id="${id}" class="inp" data-flt="${campo}"><option value="">${vazio}</option>${opts.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${v}" ${String(f[campo]) === String(v) ? 'selected' : ''}>${t}</option>`; }).join('')}</select>`;
    const ativos = ['estilo', 'corpo', 'cima', 'baixo', 'visita'].some(k => f[k]) || f.aniver || f.q;
    const aniverHoje = S.clientes.filter(c => +c.aniverMes === mesAtual).length;
    let corpo;
    if (S.dbStatus === 'off') corpo = `<div class="empty"><h2 class="h2">Armazenamento indisponível</h2><p class="muted">O navegador bloqueou o armazenamento. Saia do modo anônimo e abra o app pelo ícone da tela inicial.</p></div>`;
    else if (S.dbStatus === 'carregando') corpo = `<div class="empty"><p class="muted">Carregando clientes…</p></div>`;
    else if (!S.clientes.length) corpo = `<div class="empty"><h2 class="h2">Nenhuma cliente cadastrada ainda</h2><p class="muted" style="max-width:52ch">As fichas aparecem aqui quando a cliente autoriza o cadastro no fim do teste, ou quando você cadastra manualmente.</p><div class="row"><button class="btn pri" data-a="novo">Fazer um teste</button><button class="btn" data-a="novoCadastro">Cadastrar cliente</button></div></div>`;
    else if (!lst.length) corpo = `<div class="empty"><p>Nenhuma cliente com esses filtros.</p><button class="btn sm" data-a="limparFiltros">Limpar filtros</button></div>`;
    else corpo = `<div class="clist">${lst.map(c => { const d = diasDesde(c.ultimaVisita), aniv = +c.aniverMes === mesAtual; return `<button class="cc" data-a="abrirCliente" data-v="${c.id}">
        <span class="nm">${esc(c.nome)}</span>
        <span class="meta">${(c.estilos || []).map((k, i) => E[k] ? `<span class="tag ${i === 0 ? 'p' : ''}">${E[k].nome}</span>` : '').join('') || '<span class="tag">Sem teste</span>'}${aniv ? `<span class="tag warn">Aniversário dia ${c.aniverDia || '?'}</span>` : ''}</span>
        <span class="sub">${[c.tamCima && 'Cima ' + esc(c.tamCima), c.tamBaixo && 'Baixo ' + esc(c.tamBaixo), c.tipoCorpo && TIPOS_CORPO[c.tipoCorpo] && TIPOS_CORPO[c.tipoCorpo].nome].filter(Boolean).join(' · ') || 'Tamanhos não informados'}</span>
        <span class="sub">${d === null ? 'Sem visitas registradas' : d === 0 ? 'Visitou hoje' : `Última visita há ${d} dia${d > 1 ? 's' : ''} · ${fmtData(c.ultimaVisita)}`}</span></button>`; }).join('')}</div>`;
    return `<div class="stack-lg">
      <div class="row" style="justify-content:space-between;align-items:flex-end"><div class="stack"><span class="eyebrow">Equipe Euphoria</span><h1 class="h1">Clientes</h1>
        <p class="muted">${S.clientes.length} cadastrada${S.clientes.length === 1 ? '' : 's'}${aniverHoje ? ` · ${aniverHoje} aniversariante${aniverHoje > 1 ? 's' : ''} em ${MESES[mesAtual - 1].toLowerCase()}` : ''}</p></div>
        <button class="btn" data-a="novoCadastro">Cadastrar cliente</button></div>
      <div class="card stack">
        <div class="field"><label for="flt-q">Buscar</label><input id="flt-q" class="inp" data-flt="q" value="${esc(f.q)}" placeholder="Nome, WhatsApp ou e-mail" autocomplete="off"></div>
        <div class="filters">
          <div class="field"><label for="flt-e">Estilo principal</label>${sel('flt-e', 'estilo', ORDEM.map(k => [k, E[k].titulo]), 'Todos')}</div>
          <div class="field"><label for="flt-c">Tipo de corpo</label>${sel('flt-c', 'corpo', Object.entries(TIPOS_CORPO).map(([k, t]) => [k, t.nome]), 'Todos')}</div>
          <div class="field"><label for="flt-tc">Tamanho de cima</label>${sel('flt-tc', 'cima', TAM_CIMA, 'Todos')}</div>
          <div class="field"><label for="flt-tb">Tamanho de baixo</label>${sel('flt-tb', 'baixo', TAM_BAIXO, 'Todos')}</div>
          <div class="field"><label for="flt-v">Última visita</label>${sel('flt-v', 'visita', [['ate30', 'Nos últimos 30 dias'], ['30', 'Sem vir há 30+ dias'], ['60', 'Sem vir há 60+ dias'], ['90', 'Sem vir há 90+ dias'], ['180', 'Sem vir há 180+ dias']], 'Qualquer data')}</div>
          <div class="field"><label for="flt-m">Aniversariantes</label><div class="row" style="flex-wrap:nowrap"><button class="chip" data-a="toggleAniver" aria-pressed="${f.aniver}">${f.aniver ? 'Ligado' : 'Desligado'}</button>${sel('flt-m', 'mes', MESES.map((m, i) => [String(i + 1), m]), 'Mês').replace('<option value="">Mês</option>', '')}</div></div>
        </div>
        ${ativos ? `<div class="row small"><span class="muted">${lst.length} resultado${lst.length === 1 ? '' : 's'}</span><button class="linkb" data-a="limparFiltros">Limpar filtros</button></div>` : ''}
      </div>
      ${S.clientes.length && (diasBackup() === null || diasBackup() > 7) ? `<div class="banner"><span><b>${diasBackup() === null ? 'Nenhum backup feito ainda.' : 'Último backup há ' + diasBackup() + ' dias.'}</b> As fichas estão só neste tablet.</span><button class="btn sm" data-a="go" data-v="backup">Fazer backup</button></div>` : ''}
      ${corpo}
      <p class="small muted">As fichas ficam guardadas só neste tablet. Faça backup toda semana na aba Backup.</p>
      </div>`;
  }

  /* Cliente (detalhe) */
  function telaCliente() {
    const c = S.clientes.find(x => x.id === S.clienteSel);
    if (!c) return `<div class="empty"><p>Cliente não encontrada.</p><button class="btn" data-a="go" data-v="clientes">Voltar</button></div>`;
    const editando = S.fichaModo === 'editar';
    const d = diasDesde(c.ultimaVisita);
    const aniv = c.aniverDia && c.aniverMes ? `${c.aniverDia} de ${MESES[c.aniverMes - 1].toLowerCase()}` : 'Não informado';
    const msgAniv = `Oi, ${c.nome}! Feliz aniversário! A equipe Euphoria preparou um carinho especial para você. Passa na loja para ver as novidades que separamos com o seu estilo.`;
    const info = (t, v) => `<div><dt>${t}</dt><dd>${v}</dd></div>`;

      <div class="row"><button class="linkb" data-a="go" data-v="clientes">← Clientes</button></div>
      <div class="row" style="justify-content:space-between;align-items:flex-end"><div class="stack" style="gap:8px"><span class="eyebrow">Ficha da cliente</span><h1 class="h1">${esc(c.nome)}</h1>
        <div class="row">${(c.estilos || []).map((k, i) => E[k] ? `<span class="tag ${i === 0 ? 'p' : ''}">${RANK_ROT[i].replace('Estilo ', '')}: ${E[k].nome}</span>` : '').join('') || '<span class="tag">Ainda sem teste</span>'}</div></div>
        <div class="row"><button class="btn pri" data-a="testeCliente">Novo teste com ${esc(c.nome.split(' ')[0])}</button></div></div>
      ${editando ? `<div class="card stack">${formFicha(S.ficha)}<div class="row"><button class="btn pri" data-a="salvarFicha" ${S.salvando ? 'disabled' : ''}>Salvar ficha</button><button class="btn ghost" data-a="cancelarFicha">Cancelar</button></div></div>` :
        `<div class="card stack"><dl class="dl" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
          ${info('WhatsApp', c.whatsapp ? `${esc(c.whatsapp)}` : '—')}${info('E-mail', esc(c.email) || '—')}${info('Aniversário', aniv)}
          ${info('Tamanho de cima', esc(c.tamCima) || '—')}${info('Tamanho de baixo', esc(c.tamBaixo) || '—')}${info('Tipo de corpo', c.tipoCorpo && TIPOS_CORPO[c.tipoCorpo] ? TIPOS_CORPO[c.tipoCorpo].nome : '—')}
          ${info('Cores favoritas', esc(lista(c.cores || [])) || '—')}${info('Outras observações', esc(c.coresOutras) || '—')}${info('Última visita', d === null ? '—' : fmtData(c.ultimaVisita) + ` (há ${d} dia${d === 1 ? '' : 's'})`)}
          ${info('Faixa etária', esc(c.faixa) || '—')}${info('Cadastro', fmtData(c.criadoEm) + (c.consentimento && c.consentimento.aceito ? ' · com autorização' : ''))}
        </dl><div class="row"><button class="btn sm" data-a="editarFicha">Editar ficha</button>
          ${c.whatsapp ? `<a class="btn sm" href="https://wa.me/${waNum(c.whatsapp)}" target="_blank" rel="noopener">Abrir WhatsApp</a><a class="btn sm" href="https://wa.me/${waNum(c.whatsapp)}?text=${encodeURIComponent(msgAniv)}" target="_blank" rel="noopener">Mensagem de aniversário</a>` : ''}</div></div>`}
      <section class="sec"><h3>Registrar visita</h3><div class="card stack"><p class="small muted">Para quando ela vier à loja sem fazer o teste. Atualiza a data da última visita.</p>
        <textarea id="visita-obs" class="inp" data-f="visitaObs" placeholder="O que ela procurou, o que levou, o que achou das sugestões">${esc(S.visitaObs)}</textarea>
        <button class="btn sm" data-a="registrarVisita" style="align-self:flex-start" ${S.salvando ? 'disabled' : ''}>Registrar visita de hoje</button></div></section>
      <section class="sec"><h3>Histórico</h3>
        ${S.historico.length ? `<div class="hist">${S.historico.map(h => {
          const sug = Object.entries(h.sugestoes || {}); const ok = sug.filter(([, v]) => v === 'ok').map(([t]) => t), no = sug.filter(([, v]) => v === 'nao').map(([t]) => t);
          return `<div><div class="row" style="justify-content:space-between"><span class="d">${fmtData(h.data)} · ${h.tipo === 'visita' ? 'Visita' : 'Teste de estilo'}</span>${h.tipo === 'teste' ? `<button class="btn sm" data-a="abrirAtend" data-v="${h.id}">Abrir</button>` : ''}</div>
          ${h.tipo === 'teste' ? `<div class="row small">${(h.estilos || []).map((k, i) => E[k] ? `<span class="tag ${i === 0 ? 'p' : ''}">${E[k].nome}</span>` : '').join('')}${h.ajustado ? '<span class="tag">ajustado</span>' : ''}${h.preliminar ? '<span class="tag warn">preliminar</span>' : ''}</div>` : ''}
          ${ok.length ? `<span class="small"><b style="color:var(--ok)">Aprovou:</b> ${esc(lista(ok))}</span>` : ''}${no.length ? `<span class="small"><b style="color:var(--bad)">Recusou:</b> ${esc(lista(no))}</span>` : ''}
          ${h.observacoes ? `<span class="small muted">${esc(h.observacoes)}</span>` : ''}</div>`; }).join('')}</div>` : '<p class="muted">Nenhum atendimento registrado.</p>'}
      </section>
      <section class="sec"><h3>Dados pessoais</h3><div class="card stack"><p class="small muted">Se a cliente pedir, apague a ficha e o histórico. Não dá para desfazer.</p>
        ${S.confirmarApagar ? `<div class="banner"><span><b>Apagar ${esc(c.nome)}?</b> A ficha e ${S.historico.length} atendimento${S.historico.length === 1 ? '' : 's'} serão removidos.</span></div><div class="row"><button class="btn danger" data-a="apagarSim">Sim, apagar tudo</button><button class="btn ghost" data-a="apagarNao">Cancelar</button></div>` : '<button class="btn sm danger" data-a="apagar" style="align-self:flex-start">Apagar cadastro</button>'}</div></section>
      </div>`;
  }
  function telaNovoCadastro() {
    return `<div class="stack-lg" style="max-width:860px"><div class="stack"><span class="eyebrow">Cadastro</span><h1 class="h1">Nova cliente</h1><p class="lead">Confirme com a cliente que ela autoriza guardar os dados.</p></div>

      <div class="actbar"><div class="wrap"><button class="btn" data-a="go" data-v="clientes">Cancelar</button><span class="sp"></span><button class="btn pri" data-a="salvarNovo" ${S.fichaOk && !S.salvando ? '' : 'disabled'}>Salvar cliente</button></div></div>`;

  /* Como funciona */
  function telaMetodo() {
    const L = Score.LIMITES;
    const linhas = PERGUNTAS.map((q, i) => `<tr><td class="n">${i + 1}</td><td>${esc(q.titulo)}</td><td>${BLOCO_ROT[q.bloco]}</td><td class="n">${q.bloco === 'contexto' ? 'não pontua' : (q.peso > 0 ? '+' : '') + q.peso}</td><td>${q.tipo === 'look' || q.tipo === 'paleta' || q.tipo === 'detalhe' || q.tipo === 'acessorio' ? 'Visual' : 'Texto'}</td></tr>`).join('');
    return `<div class="stack-lg"><div class="stack"><span class="eyebrow">Método</span><h1 class="h1">Como a pontuação funciona</h1>
      <p class="lead">O teste é uma orientação de consultoria de estilo, não um diagnóstico. Ele não usa percentuais nem promete precisão: mostra tendências e explica de onde elas vieram.</p></div>
      <section class="sec"><h3>As 12 perguntas</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Pergunta</th><th>Bloco</th><th>Peso</th><th>Formato</th></tr></thead><tbody>${linhas}</tbody></table></div>
        <div class="prose small"><p>Nas perguntas de gosto, imagem e evitar, cada uma das 7 opções representa um estilo, em ordem embaralhada para não induzir a escolha.</p></div></section>
      <section class="sec"><h3>Regras</h3><div class="prose">
        <p><b>Gosto atual define o estilo.</b> As perguntas 1 a 6 somam pontos para os estilos escolhidos. Modelagem e look do dia a dia pesam 3, porque mostram o que ela realmente usa. As demais pesam 2.</p>
        <p><b>Duas opções dividem o peso.</b> Marcar duas opções numa pergunta de peso 3 dá 1,5 para cada. Assim, marcar mais não infla nenhum estilo.</p>
        <p><b>O que ela evita tira pontos.</b> Cada opção da pergunta 7 tira 1 ponto do estilo correspondente.</p>
        <p><b>A imagem desejada é separada.</b> As perguntas 8, 9 e 12 formam um placar próprio. Ele não muda o estilo atual, mas aparece no resultado ("hoje você se veste assim, mas gostaria de transmitir...") e orienta a consultora.</p>
        <p><b>Rotina e prioridades só contextualizam.</b> As perguntas 10 e 11 não somam pontos. Elas geram avisos para a consultora, como separar estilo de ocasião.</p>
        <p><b>Branco, "depende" e "nenhuma" não pontuam.</b> Aparecem para a consultora como pontos de conversa.</p></div></section>
      <section class="sec"><h3>Principal, secundário e terciário</h3><div class="prose">
        <p><b>Principal:</b> maior pontuação, com pelo menos ${L.principalMin} pontos e presença em ${L.evidMin}+ perguntas diferentes. Se não atingir, o resultado é marcado como preliminar.</p>
        <p><b>Secundário:</b> pelo menos ${L.secMin} pontos, presente em ${L.evidMin}+ perguntas e com no mínimo ${L.secProp * 100}% dos pontos do principal.</p>
        <p><b>Terciário:</b> pelo menos ${L.terMin} pontos, presente em ${L.evidMin}+ perguntas e com no mínimo ${L.terProp * 100}% dos pontos do principal.</p>

  /* ---------- PDF ---------- */
  function svgParaPng(svg, w, h) {
    return new Promise((res) => {
      const img = new Image();
      img.onload = () => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const ctx = cv.getContext('2d'); ctx.fillStyle = '#F3EEF1'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h); res(cv.toDataURL('image/png')); };
      img.onerror = () => res(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', `<svg width="${w}" height="${h}" `));
    });
  }

    // cabeçalho
    doc.setFillColor(11, 10, 11); doc.rect(0, 0, W, 34, 'F');

    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'normal'); doc.setFontSize(9);

    cancelarFicha: () => { S.fichaModo = null; render(); },
    salvarFicha: async () => { S.salvando = true; render(); try { await S.db.doc('clientes/' + S.clienteSel).update(clean(fichaPayload(S.ficha))); S.fichaModo = null; toast('Ficha atualizada.'); } catch (e) { toast(msgErro(e)); } S.salvando = false; render(); },
    testeCliente: () => { const c = S.clientes.find(x => x.id === S.clienteSel); S.sessao = novaSessao(); S.sessao.clienteId = c.id; S.sessao.dados.nome = c.nome; S.sessao.dados.faixa = c.faixa || ''; S.sessao.tipoCorpo = c.tipoCorpo || ''; S.sessao.consent = 'sim'; go('dados'); },
    registrarVisita: async () => {
      if (!S.db) return; S.salvando = true; render();
      try { const id = uid('a_'); await S.db.doc('atendimentos/' + id).set({ clienteId: S.clienteSel, tipo: 'visita', data: hoje(), observacoes: S.visitaObs || '' }); await S.db.doc('clientes/' + S.clienteSel).update({ ultimaVisita: hoje() }); S.visitaObs = ''; toast('Visita registrada.'); await carregarHistorico(S.clienteSel); }
      catch (e) { toast(msgErro(e)); } S.salvando = false; render();
    },
    abrirAtend: (v) => {
      const h = S.historico.find(x => x.id === v); if (!h) return;
      const ses = novaSessao(); Object.assign(ses, { id: 's_' + v, inicio: h.data, dados: h.dados || { nome: '', faixa: '', finalidades: [] }, respostas: h.respostas || {}, desempates: h.desempates || [], clienteId: h.clienteId, atendimentoId: h.id, validacao: h.validacao || null, ajuste: h.ajustado ? h.estilos : null, observacoes: h.observacoes || '', sugestoes: h.sugestoes || {}, extras: h.extras || [], tipoCorpo: h.tipoCorpo || '', consent: 'sim', qi: PERGUNTAS.length, pulouRefino: true });
      if (!ses.dados.finalidades) ses.dados.finalidades = [];
      S.sessao = ses; go('resultado');
    },
    apagar: () => { S.confirmarApagar = true; render(); },
    apagarNao: () => { S.confirmarApagar = false; render(); },
    apagarSim: async () => {
      S.salvando = true;
      try { for (const h of S.historico) await S.db.doc('atendimentos/' + h.id).delete(); await S.db.doc('clientes/' + S.clienteSel).delete(); S.clientes = S.clientes.filter(c => c.id !== S.clienteSel); toast('Cadastro apagado.'); S.salvando = false; go('clientes'); }
      catch (e) { S.salvando = false; toast(msgErro(e)); render(); }
    },
    backupShare: async () => { const nome = 'euphoria-backup-' + dataArq() + '.json'; await compartilharArquivo(nome, backupBlob(), 'application/json', 'Backup Euphoria Estilo'); await marcarBackup(); toast('Backup gerado.'); render(); },
    backupBaixar: async () => { salvarArquivo('euphoria-backup-' + dataArq() + '.json', backupBlob()); await marcarBackup(); toast('Backup salvo na pasta Downloads.'); render(); },
    csv: () => { salvarArquivo('euphoria-clientes-' + dataArq() + '.csv', csvClientes()); toast('Planilha salva na pasta Downloads.'); },
    cancelarImport: () => { S.importacao = null; const el = document.getElementById('arq-backup'); if (el) el.value = ''; render(); },
    importar: async (modo) => { try { const n = await LocalDB.importar(S.importacao.obj, modo); S.importacao = null; toast(n + ' registros restaurados.'); } catch (e) { toast(e.message || 'Não foi possível restaurar.'); } render(); },
    novoCadastro: () => { S.ficha = fichaVazia(); S.fichaOk = false; go('novoCadastro'); },
    salvarNovo: async () => { const id = await criarCliente(S.ficha, false); if (id) { toast('Cliente cadastrada.'); S.clienteSel = id; S.fichaModo = null; S.historico = []; go('cliente'); } else render(); }
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
    const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el.dataset.v, el); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.f && el.type !== 'checkbox' && el.tagName !== 'SELECT') {
      setPath(el.dataset.f, el.value);
      if (el.dataset.f === 'dados.nome') { guardarRascunho(); render(); }
    }
    if (el.dataset.flt && el.tagName === 'INPUT') { S.filtros[el.dataset.flt] = el.value; render(); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.f && el.type === 'checkbox') { setPath(el.dataset.f, el.checked); render(); }
    else if (el.dataset.f && el.tagName === 'SELECT') { setPath(el.dataset.f, el.value); }
    if (el.dataset.flt && el.tagName === 'SELECT') { S.filtros[el.dataset.flt] = el.value; render(); }
    if (el.id === 'arq-backup' && el.files && el.files[0]) {
      const fr = new FileReader();
      fr.onload = () => { try { const obj = JSON.parse(fr.result); if (!obj || obj.app !== 'Euphoria Estilo') throw 0; const ks = Object.keys(obj.docs || {}); S.importacao = { obj, nCli: ks.filter(k => k.startsWith('clientes/')).length, nAt: ks.filter(k => k.startsWith('atendimentos/')).length }; } catch (e) { S.importacao = null; toast('Este arquivo não é um backup do Euphoria Estilo.'); } render(); };
      fr.readAsText(el.files[0]);
    }
    if (el.dataset.a2 === 'ajuste') {
      const c = calc(); const aj = (S.sessao.ajuste || c.r.estilos).slice(); aj[+el.dataset.i] = el.value || null;
      const lim = []; for (const k of aj) { if (!k) break; if (!lim.includes(k)) lim.push(k); }
      S.sessao.ajuste = lim.length ? lim : null; marcarSujo(); render();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'nova-sug') { e.preventDefault(); A.addSug(); } });

  render(); iniciarDb();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
})();

</script>
</body>
</html>
